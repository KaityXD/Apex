# Apex Anti-Cheat config
prefix: "&#00f2fe&lAPEX &8» &7"

alerts:
  permission: "apex.alerts"
  format: "&8[&#00f2fe&lAPEX&8] &b%player% &7failed &f%check% &8(&7VL: &b%vl%&8)"
  click-to-teleport: true

punishments:
  appeal-url: "https://discord.gg/your-server"
  broadcast:
    enabled: true
    format: "&8[&#00f2fe&lAPEX&8] &b%player% &7was suspended by Apex for &c%reason% &8(&f%check%&8)"
  ban-screen:
    - "&cYou have been suspended"
    - ""
    - "&7Reason: &f%reason%"
    - "&7Check: &f%check%"
    - "&7Expires: &f%expires%"
    - "&7ID: &8%id%"
    - ""
    - "&7Appeal at: &b%appeal%"

checks:
  movement:
    simulation:
      enabled: true
      max-buffer: 3.5
      setback: true
      auto-ban: true
      max-vl: 30
      ban-duration: "30d"
    strafe:
      enabled: true
      setback: true
      auto-ban: true
      max-vl: 10
      ban-duration: "14d"
    velocity:
      enabled: true
      auto-ban: true
      max-vl: 6
      ban-duration: "14d"
    noslow:
      enabled: true
      setback: true
      auto-ban: true
      max-vl: 8
      ban-duration: "14d"
    inventory:
      enabled: true
      setback: true
      auto-ban: true
      max-vl: 6
      ban-duration: "14d"
    nofall:
      enabled: true
      auto-ban: true
      max-vl: 5
      ban-duration: "14d"
    jesus:
      enabled: true
      setback: true
      auto-ban: true
      max-vl: 8
      ban-duration: "14d"
    fly:
      enabled: true
      setback: true
      auto-ban: true
      max-vl: 10
      ban-duration: "30d"
    ground-spoof:
      enabled: true
      setback: true
      auto-ban: false
      max-vl: 20
      ban-duration: "14d"
    timer:
